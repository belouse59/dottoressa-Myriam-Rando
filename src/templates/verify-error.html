<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: #F7F6F4;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 600px;
            padding: 50px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }

        h1 {
            color: #1F2937;
        }

        p {
            color: #6B7280;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 24px;
            border-radius: 999px;
            text-decoration: none;
            background: #8B7E74;
            color: white;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Link non valido o scaduto</h1>

        <p>
            Questo link di verifica non è più disponibile.
        </p>

        <p>
            Ti invito a inviare nuovamente la richiesta dal sito.
        </p>

        <a href="{{APP_URL}}">
            Torna al sito
        </a>
    </div>
</body>

</html>
