<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- FAVICON -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon.png">

  <!-- Apple (iPhone / iPad home screen icon) -->
  <link rel="apple-touch-icon" href="/assets/images/favicon.png">

  <!-- Mobile browser color (address bar / UI) -->
  <meta name="theme-color" content="#F7F6F4">
  <title>Dott.ssa Myriam Rando</title>
  <meta name="robots" content="noindex, nofollow">
  <title>Richiesta non disponibile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #F7F6F4;
      --card: rgba(255, 255, 255, 0.72);
      --text: #374151;
      --heading: #1F2937;
      --accent: #8B7E74;
      --border: rgba(139, 126, 116, 0.18);
      --shadow: 0 20px 60px rgba(31, 41, 55, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(139, 126, 116, 0.08), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14, 165, 164, 0.05), transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .wrapper {
      width: 100%;
      max-width: 620px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 64px 48px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: fadeUp 0.8s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    .icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: rgba(139, 126, 116, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--accent);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(34px, 5vw, 48px);
      font-weight: 600;
      color: var(--heading);
      line-height: 1.15;
      margin-bottom: 18px;
      letter-spacing: -0.03em;
    }

    p {
      font-size: 1rem;
      line-height: 1.8;
      max-width: 460px;
      margin: 0 auto;
      color: #6B7280;
    }

    p+p {
      margin-top: 14px;
    }

    .actions {
      margin-top: 38px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-weight: 500;
      font-size: 0.95rem;
      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease,
        opacity 0.35s ease;
      box-shadow: 0 8px 24px rgba(139, 126, 116, 0.22);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(139, 126, 116, 0.26);
    }

    .note {
      margin-top: 26px;
      font-size: 0.9rem;
      color: #9CA3AF;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .card {
        padding: 48px 28px;
        border-radius: 22px;
      }

      h1 {
        font-size: 34px;
      }

      p {
        font-size: 0.96rem;
      }
    }
  </style>
</head>

<body>

  <main class="wrapper">
    <section class="card">

      <div class="icon">✦</div>

      <h1>Richiesta non disponibile</h1>

      <p>
        Questa richiesta non è più disponibile o potrebbe essere stata rimossa.
      </p>

      <p>
        Se desideri ancora essere contattato, puoi inviare nuovamente il modulo.
      </p>

      <div class="actions">
        <a href="{{APP_URL}}" class="btn">
          Torna al sito
        </a>
      </div>

      <p class="note">
        Studio professionale · Supporto psicologico
      </p>

    </section>
  </main>

</body>

</html>
