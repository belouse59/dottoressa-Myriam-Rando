<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- FAVICON -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon.png">

  <!-- Apple (iPhone / iPad home screen icon) -->
  <link rel="apple-touch-icon" href="/assets/images/favicon.png">

  <!-- Mobile browser color (address bar / UI) -->
  <meta name="theme-color" content="#F7F6F4">
  <title>Errore</title>

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #F7F6F4;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      max-width: 520px;
      background: white;
      padding: 42px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #1F2937;
    }

    p {
      line-height: 1.6;
      margin-bottom: 28px;
      color: #6B7280;
    }

    a {
      display: inline-block;
      background: #1F2937;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Qualcosa è andato storto</h1>
    <p>
      Si è verificato un errore inatteso.  
      Ti invitiamo a riprovare più tardi oppure tornare al sito principale.
    </p>

    <a href="{{APP_URL}}">Torna al sito</a>
  </div>
</body>
</html>
