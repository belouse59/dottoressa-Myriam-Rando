<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #F7F6F4;
      font-family: 'Inter', sans-serif;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 650px;
      padding: 60px 50px;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      color: #1F2937;
      margin-bottom: 20px;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
      color: #6B7280;
    }

    .icon {
      font-size: 46px;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 26px;
      border-radius: 999px;
      text-decoration: none;
      background: #8B7E74;
      color: white;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon">🌿</div>

    <h1>Email verificata</h1>

    <p>
      Grazie per aver confermato il tuo indirizzo email.
    </p>

    <p>
      La tua richiesta è stata ricevuta correttamente.
      Sarai ricontattato al più presto.
    </p>

    <a href="{{APP_URL}}">
      Torna al sito
    </a>
  </div>

</body>

</html>
